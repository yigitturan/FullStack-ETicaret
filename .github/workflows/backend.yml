name: Backend CI

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo cek
        uses: actions/checkout@v3

      - name: Java kur
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven wrapper izni ver
        run: chmod +x ./backend/mvnw

      - name: Build al
        run: ./backend/mvnw clean install