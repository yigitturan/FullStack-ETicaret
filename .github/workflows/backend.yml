name: Backend CI

on:
  push:
    branches: [ "develop", "feature/ai-assistant" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo cek
        uses: actions/checkout@v3

      - name: Java kur
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven wrapper izni ver
        run: chmod +x mvnw
        working-directory: backend

      - name: Build al
        run: ./mvnw clean install -DskipTests
        working-directory: backend

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"✅ y11 Backend CI basariyla tamamlandi 🚀\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"❌ y11 Backend CI hata verdi!\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Test Notification
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"🧪 y11 Slack test bildirimi\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"